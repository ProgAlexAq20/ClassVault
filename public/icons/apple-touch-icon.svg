<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iOS app icon background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="90" y1="0" x2="90" y2="180">
      <stop offset="0%" style="stop-color:#64BC7D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9A62;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="42" fill="url(#bgGradient)"/>
  
  <!-- Book spine -->
  <rect x="88" y="30" width="4" height="120" rx="2" fill="#FFFFFF" opacity="0.2"/>
  
  <!-- Left page -->
  <path d="M35 30C35 23 40 18 48 18H88V155C88 160 35 163 35 150V30Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right page -->
  <path d="M92 18V155C92 163 145 160 145 150C145 30 145 25 145 30C145 23 140 18 132 18H92Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Green leaf bookmark on left -->
  <g opacity="1">
    <!-- Leaf shape -->
    <path d="M62 25C70 17 85 12 85 38C85 56 70 72 62 80C54 72 39 56 39 38C39 12 54 17 62 25Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Leaf vein -->
    <path d="M62 28C62 28 62 52 62 78" stroke="#4A9A62" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Text lines for realism -->
  <line x1="45" y1="60" x2="78" y2="60" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="45" y1="75" x2="78" y2="75" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  
  <line x1="102" y1="60" x2="135" y2="60" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="102" y1="75" x2="135" y2="75" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
