<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rounded square background -->
  <rect width="512" height="512" rx="112" fill="currentColor" opacity="0"/>
  
  <!-- Book spine (center dividing line) -->
  <rect x="250" y="120" width="12" height="272" rx="6" fill="#333333" opacity="0.3"/>
  
  <!-- Left page -->
  <path d="M120 120C120 95.147 140.147 75 165 75H244V345C244 356.046 233.046 365 222 365H165C140.147 365 120 344.853 120 320V120Z" fill="#FFFFFF" stroke="#64BC7D" stroke-width="10"/>
  
  <!-- Right page -->
  <path d="M268 120V345C268 356.046 278.954 365 290 365H347C371.853 365 392 344.853 392 320V120C392 95.147 371.853 75 347 75H268V120Z" fill="#FFFFFF" stroke="#64BC7D" stroke-width="10"/>
  
  <!-- Green leaf/bookmark accent on left page -->
  <g opacity="0.85">
    <!-- Leaf stem -->
    <path d="M190 110C190 110 190 160 195 200" stroke="#64BC7D" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- Leaf shape -->
    <path d="M195 110C210 95 240 85 240 120C240 155 210 180 195 200C180 180 150 155 150 120C150 85 180 95 195 110Z" fill="#64BC7D" stroke="#64BC7D" stroke-width="2.5"/>
    
    <!-- Leaf vein detail -->
    <path d="M195 115C195 115 195 150 195 195" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Bookmark ribbon detail on right page -->
  <rect x="310" y="70" width="14" height="160" rx="7" fill="#64BC7D" opacity="0.4"/>
  
  <!-- Text lines on pages for detail -->
  <line x1="150" y1="180" x2="220" y2="180" stroke="#DDDDDD" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="150" y1="220" x2="220" y2="220" stroke="#DDDDDD" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="150" y1="260" x2="220" y2="260" stroke="#DDDDDD" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  
  <line x1="280" y1="180" x2="350" y2="180" stroke="#DDDDDD" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="280" y1="220" x2="350" y2="220" stroke="#DDDDDD" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="280" y1="260" x2="350" y2="260" stroke="#DDDDDD" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
