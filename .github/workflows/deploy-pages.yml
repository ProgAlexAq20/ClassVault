name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Build
      env:
        VITE_APP_URL: https://progalexaq20.github.io/ClassVault
        VITE_ALLOWED_ORIGINS: https://progalexaq20.github.io
        VITE_FIREBASE_API_KEY: "AIzaSyCOU0m2qSwY8WXTzEloQUYBNR9OYfgGEeI"
        VITE_FIREBASE_AUTH_DOMAIN: "classvaulte.firebaseapp.com"
        VITE_FIREBASE_DATABASE_URL: "https://classvaulte-default-rtdb.firebaseio.com"
        VITE_FIREBASE_PROJECT_ID: "classvaulte"
        VITE_FIREBASE_STORAGE_BUCKET: "classvaulte.firebasestorage.app"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "171443833329"
        VITE_FIREBASE_APP_ID: "1:171443833329:web:8ee1283ca083f10fe65c50"
        VITE_FIREBASE_MEASUREMENT_ID: "G-9CRNKLBJMG"
        VITE_RECAPTCHA_SITE_KEY: "6LfKegstAAAAAJXG5ltSfVptrYAenRm22Pwmgqgx"
      run: npm run build

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
